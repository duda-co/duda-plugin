name: release-please

# Opens (and keeps updating) a release PR that collects every Conventional
# Commit landed on main. Merging that PR bumps the version in
# .claude-plugin/plugin.json, updates CHANGELOG.md, tags, and publishes a
# GitHub Release. feat -> minor, fix -> patch, "!"/BREAKING CHANGE -> major.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never let two release runs race on the same branch.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
